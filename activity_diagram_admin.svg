@startuml
skinparam dpi 180
skinparam defaultFontName "SansSerif"
skinparam ActivityFontSize 12
skinparam ActivityBorderColor #742A2A
skinparam ActivityBackgroundColor #FFF5F5
skinparam ActivityDiamondBorderColor #9B2C2C
skinparam ActivityDiamondBackgroundColor #FEFCBF
skinparam SwimlaneTitleFontSize 14
skinparam SwimlaneTitleFontStyle bold
skinparam SwimlaneBorderColor #A0AEC0
skinparam SwimlaneWidth 280

title **ACTIVITY DIAGRAM ADMIN - GEGARES**

|Admin|
start
:Membuka Halaman Login Admin (/admin/login);

|Sistem|
:Menampilkan Form Login Admin;

|Admin|
:Mengisi Email & Password Admin;

|Sistem|
:Validasi Hak Akses Admin;
if (Hasil Validasi?) then (Gagal / Bukan Admin)
  :Menampilkan Pesan Akses Ditolak;
  stop
else (Berhasil / Admin Valid)
  :Menampilkan Halaman Dashboard Admin;
endif

|Admin|
:Memilih Operasi Manajemen Toko;
note right
  Admin memilih salah satu operasi:
  1. Kelola Kategori Produk
  2. Kelola Produk & Varian (Galeri Foto)
  3. Kelola Kode Promo / Kupon
  4. Kelola Pesanan & Cetak Laporan
  5. Moderasi Ulasan Pelanggan
  6. Kelola Data Pengguna & Hak Akses
  7. Pengaturan Toko & Content Editor
end note

|Sistem|
:Menampilkan Halaman Manajemen Yang Dipilih;

|Admin|
:Melakukan Pengelolaan Toko (Tambah / Edit / Hapus Data);

|Sistem|
:Menyimpan Perubahan Data & Memperbarui Tampilan;

|Admin|
:Mengklik Tombol Keluar (Logout);

|Sistem|
:Keluar dari Akun Admin & Kembali ke Form Login;

|Admin|
stop
@enduml

